# Deploy from Render > New > Blueprint to apply this configuration.
services:
  - type: web
    name: king-david-digital-studio
    runtime: static
    branch: main
    buildCommand: 'echo "Static website ready"'
    staticPublishPath: ./public
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: "/*"
        name: X-Content-Type-Options
        value: nosniff
      - path: "/*"
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: "/*"
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
